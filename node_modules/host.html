<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>لوحة المضيف</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4ead7;
      color: #302018;

      font-family: Arial, sans-serif;
    }

    .host-panel {
      width: min(100%, 460px);
      padding: 32px;

      border: 1px solid #c59a56;
      border-radius: 12px;

      background: #fffaf0;
      box-shadow: 0 20px 45px rgba(60, 35, 20, 0.16);

      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #8f4934;
    }

    #status {
      color: #765f50;
      line-height: 2;
    }

    #incomingCall {
      display: none;
      margin-top: 25px;
      padding: 22px;

      border-radius: 10px;
      background: #f3dfc0;
    }

    #incomingCall.visible {
      display: block;
      animation: showCall 0.35s ease;
    }

    #incomingCall h2 {
      margin-top: 0;
      color: #8f4934;
    }

    button {
      margin: 7px;
      padding: 12px 20px;

      border: 0;
      border-radius: 6px;

      color: white;
      font-family: inherit;
      font-weight: bold;

      cursor: pointer;
    }

    #acceptButton {
      background: #5d8055;
    }

    #rejectButton {
      background: #963f35;
    }

    button:hover {
      opacity: 0.85;
    }

    @keyframes showCall {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="host-panel">

    <h1>
      لوحة المضيف
    </h1>

    <p id="status">
      جاري الاتصال بالخادم...
    </p>

    <section id="incomingCall">

      <h2>
        مكالمة واردة
      </h2>

      <p>
        يوجد سائح يريد التواصل معك.
      </p>

      <button
        id="acceptButton"
        type="button"
      >
        قبول المكالمة
      </button>

      <button
        id="rejectButton"
        type="button"
      >
        رفض المكالمة
      </button>

    </section>
<section id="callPanel" hidden>
  <h2>المكالمة</h2>

  <video
    id="localVideo"
    autoplay
    muted
    playsinline
  ></video>

  <video
    id="remoteVideo"
    autoplay
    playsinline
  ></video>

  <button id="endCallButton" type="button">
    إنهاء المكالمة
  </button>
</section>
  </main>

  <script src="./host.js"></script>

</body>

</html>
