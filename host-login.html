<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لوحة المضيف - رياض دار النخيل">
  <title>لوحة المضيف - رياض دار النخيل</title>
  <link rel="stylesheet" href="index.css">
  <style>
    body { background: linear-gradient(135deg, #3e2b20 0%, #6b4423 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 20px; }
    .login-card { background:var(--paper); padding:48px 40px; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.4); text-align:center; max-width:440px; width:100%; border:2px solid var(--gold); }
    .login-card h1 { font-family:Amiri,serif; color:var(--brown); font-size:36px; margin-bottom:6px; }
    .login-card .sub { color:var(--brown-light); font-size:14px; margin-bottom:32px; }
    
    .google-btn { display:inline-flex; align-items:center; gap:14px; padding:14px 28px; border:2px solid var(--gold); border-radius:8px; background:#fff; cursor:pointer; font-size:16px; font-family:Cairo,sans-serif; font-weight:bold; color:var(--brown); transition:all .3s; width: 100%; justify-content: center; }
    .google-btn:hover { background:var(--gold-light); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.2); }
    .google-btn .icon { font-size:24px; }
    
    .room-join-form { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); text-align: right; }
    .room-join-form h3 { font-family: Amiri, serif; color: var(--brown); font-size: 20px; margin-bottom: 16px; text-align: center; }
    .room-join-form label { display: block; font-size: 13px; color: var(--brown-light); margin-bottom: 8px; font-weight: 600; }
    .room-join-form .input-group { display: flex; gap: 8px; }
    .room-join-form input { flex: 1; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; font-family: Cairo, sans-serif; font-size: 14px; direction: ltr; text-align: center; letter-spacing: 2px; }
    .room-join-form input:focus { outline: none; border-color: var(--terracotta); box-shadow: 0 0 0 3px rgba(147,73,54,0.15); }
    .room-join-form .join-btn { width: 100%; margin-top: 12px; padding: 14px; background: var(--terracotta); color: white; border: none; border-radius: 8px; font-family: Cairo, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .room-join-form .join-btn:hover { background: var(--terracotta-dark); transform: translateY(-2px); }
    
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--brown-light); font-size: 13px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    
    .status { margin-top:24px; font-size:14px; color:var(--brown-light); min-height:20px; }
    .back-link { margin-top:20px; display:block; color:var(--gold); text-decoration:none; font-size:13px; }
    .back-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🏠 رياض دار النخيل</h1>
    <p class="sub">لوحة المضيف - Host Dashboard</p>
    
    <button class="google-btn" id="googleLoginBtn">
      <span class="icon">🔍</span>
      <span>Sign in with Google</span>
    </button>
    
    <p class="status" id="status"></p>
    
    <div class="divider">أو</div>
    
    <div class="room-join-form">
      <h3>📞 الانضمام لمكالمة</h3>
      <label for="roomIdInput">معرف الغرفة (Room ID):</label>
      <div class="input-group">
        <input type="text" id="roomIdInput" placeholder="call-xyz123..." autocomplete="off" spellcheck="false">
      </div>
      <button class="join-btn" id="joinRoomBtn">📞 الانضمام للغرفة</button>
      <button class="join-btn" id="createRoomBtn" style="background:var(--gold);color:var(--brown);margin-top:8px;">➕ إنشاء غرفة جديدة (مضيف)</button>
    </div>
    
    <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>
  </div>

  <script>
    document.getElementById("googleLoginBtn").addEventListener("click", function() {
      const status = document.getElementById("status");
      status.textContent = "جاري التوجيه إلى Google...";
      status.style.color = "#934936";
      
      // Simulate Google OAuth - in production this would redirect to Google OAuth
      setTimeout(function() {
        status.textContent = "تم التحميل... يتم التوجيه للوحة المضيف";
        status.style.color = "#3d7a52";
        setTimeout(function() {
          window.location.href = "host.html";
        }, 1000);
      }, 1500);
    });

    // Join room by ID
    document.getElementById("joinRoomBtn").addEventListener("click", function() {
      const roomId = document.getElementById("roomIdInput").value.trim();
      if (!roomId) {
        alert("يرجى إدخال معرف الغرفة");
        return;
      }
      window.location.href = `call.html?room=${encodeURIComponent(roomId)}`;
    });

// Allow Enter key to join
document.getElementById("roomIdInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    document.getElementById("joinRoomBtn").click();
  }
});

// Create new room and join as host
document.getElementById("createRoomBtn").addEventListener("click", function() {
  const roomId = 'call-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 9);
  window.location.href = `call.html?room=${encodeURIComponent(roomId)}`;
});
  </script>
</body>
</html>
