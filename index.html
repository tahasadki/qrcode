<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مترجم فوري</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
    header { background: #2563eb; color: white; padding: 20px; text-align: center; position: relative; }
    header h1 { font-size: 1.5rem; font-weight: 600; }
    .nav-tabs { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .nav-tab { padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.2); color: white; border: none; }
    .nav-tab:hover { background: rgba(255,255,255,0.3); }
    .nav-tab.active { background: white; color: #2563eb; }
    .controls { padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; background: #fafafa; border-bottom: 1px solid #eee; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.9rem; color: #374151; font-weight: 500; }
    select, input[type="password"], input[type="text"], input[type="email"] { padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; background: white; min-width: 180px; }
    select:focus, input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #startBtn { background: #16a34a; color: white; }
    #startBtn:hover:not(:disabled) { background: #15803d; }
    #stopBtn { background: #dc2626; color: white; }
    #stopBtn:hover:not(:disabled) { background: #b91c1c; }
    .btn-google { background: #4285f4; color: white; display: inline-flex; align-items: center; gap: 8px; }
    .btn-google:hover:not(:disabled) { background: #3367d6; }
    .btn-logout { background: #6b7280; color: white; }
    .btn-logout:hover:not(:disabled) { background: #4b5563; }
    .text-areas { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #e5e7eb; padding: 1px; }
    .text-area-wrapper { background: white; padding: 16px; }
    .text-area-wrapper label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 1rem; line-height: 1.6; resize: vertical; font-family: inherit; }
    textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    textarea[readonly] { background: #f9fafb; color: #374151; }
    .api-section { padding: 20px; background: #fafafa; border-top: 1px solid #eee; }
    .api-section label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #374151; }
    .api-input-wrapper { display: flex; gap: 8px; }
    .api-input-wrapper input { flex: 1; }
    .status { padding: 12px 20px; font-size: 0.9rem; text-align: center; color: #6b7280; background: #fafafa; border-top: 1px solid #eee; min-height: 44px; }
    .status.active { color: #16a34a; background: #f0fdf4; }
    .status.error { color: #dc2626; background: #fef2f2; }
    
    /* Host page styles */
    .host-page { display: none; padding: 20px; }
    .host-page.active { display: block; }
    .user-info { display: flex; align-items: center; gap: 12px; padding: 16px; background: #f0f9ff; border-radius: 8px; margin-bottom: 20px; }
    .user-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .user-details { flex: 1; }
    .user-name { font-weight: 600; font-size: 1.1rem; color: #1e3a5f; }
    .user-email { font-size: 0.9rem; color: #64748b; }
    .host-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #2563eb; }
    .stat-label { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .connections-list { background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .connection-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; }
    .connection-item:last-child { border-bottom: none; }
    .connection-info { display: flex; align-items: center; gap: 12px; }
    .connection-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #4338ca; }
    .connection-details { flex: 1; }
    .connection-name { font-weight: 500; color: #1e293b; }
    .connection-meta { font-size: 0.8rem; color: #94a3b8; }
    .connection-status { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .status-connected { background: #dcfce7; color: #166534; }
    .status-waiting { background: #fef3c7; color: #92400e; }
    .status-disconnected { background: #fee2e2; color: #991b1b; }
    
    .auth-section { padding: 20px; background: #fafafa; border-top: 1px solid #eee; text-align: center; }
    .auth-section h3 { margin-bottom: 12px; color: #374151; }
    
    @media (max-width: 640px) {
      .text-areas { grid-template-columns: 1fr; }
      .controls { flex-direction: column; align-items: stretch; }
      .control-group { width: 100%; justify-content: space-between; }
      .api-input-wrapper { flex-direction: column; }
      .host-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>مترجم فوري</h1>
      <div class="nav-tabs">
        <button class="nav-tab active" data-page="translator">🎤 المترجم</button>
        <button class="nav-tab" data-page="host">🏠 لوحة المضيف</button>
      </div>
    </header>

    <!-- Translator Page -->
    <div id="translatorPage" class="page active">
      <div class="controls">
        <div class="control-group">
          <label for="sourceLang">لغة المصدر:</label>
          <select id="sourceLang">
            <option value="ar">العربية</option>
            <option value="darija">المغربية (الدارجة)</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="tr">Türkçe</option>
          </select>
        </div>
        <div class="control-group">
          <button id="startBtn">ابدأ</button>
          <button id="stopBtn" disabled>إيقاف</button>
        </div>
      </div>
      <div class="text-areas">
        <div class="text-area-wrapper">
          <label>النص الأصلي</label>
          <textarea id="sourceText" placeholder="سيظهر النص المسموع هنا..." readonly></textarea>
        </div>
        <div class="text-area-wrapper">
          <label>الترجمة</label>
          <textarea id="targetText" placeholder="ستظهر الترجمة هنا..." readonly></textarea>
        </div>
      </div>
      <div class="api-section">
        <label for="apiKey">مفتاح OpenRouter API:</label>
        <div class="api-input-wrapper">
          <input type="password" id="apiKey" placeholder="sk-or-v1-..." aria-label="OpenRouter API Key" value="sk-b0f84498e73e4625-2aa2b8-ef6c6b91">
        </div>
      </div>
      <div class="status" id="status">جاهز للبدء</div>
    </div>

    <!-- Host Page -->
    <div id="hostPage" class="page host-page">
      <div id="authSection" class="auth-section">
        <h3>تسجيل الدخول للوصول للوحة المضيف</h3>
        <p style="color: #6b7280; margin-bottom: 16px;">سجل دخولك بحساب Google لإدارة الاتصالات</p>
        <button id="googleSignInBtn" class="btn-google">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          تسجيل الدخول بـ Google
        </button>
      </div>

      <div id="hostContent" style="display: none;">
        <div class="user-info">
          <img id="userAvatar" class="user-avatar" src="" alt="User">
          <div class="user-details">
            <div class="user-name" id="userName">جاري التحميل...</div>
            <div class="user-email" id="userEmail"></div>
          </div>
          <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
        </div>

        <div class="host-stats">
          <div class="stat-card">
            <div class="stat-value" id="totalConnections">0</div>
            <div class="stat-label">إجمالي الاتصالات</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="activeConnections">0</div>
            <div class="stat-label">نشطة الآن</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="totalMessages">0</div>
            <div class="stat-label">الرسائل المترجمة</div>
          </div>
        </div>

        <div class="connections-list" id="connectionsList">
          <div style="padding: 20px; text-align: center; color: #94a3b8;">لا توجد اتصالات حالية</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Config (load before Firebase SDK) -->
  <script src="firebase-config.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, getIdToken } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    // Firebase Config - loaded from firebase-config.js
    const firebaseConfig = window.__FIREBASE_CONFIG__;

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');

    // DOM Elements
    const navTabs = document.querySelectorAll('.nav-tab');
    const pages = document.querySelectorAll('.page');
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authSection = document.getElementById('authSection');
    const hostContent = document.getElementById('hostContent');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userEmail = document.getElementById('userEmail');
    const connectionsList = document.getElementById('connectionsList');
    const totalConnections = document.getElementById('totalConnections');
    const activeConnections = document.getElementById('activeConnections');
    const totalMessages = document.getElementById('totalMessages');

    // Navigation
    navTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const page = tab.dataset.page;
        navTabs.forEach(t => t.classList.toggle('active', t.dataset.page === page));
        pages.forEach(p => p.classList.toggle('active', p.id === `${page}Page`));
      });
    });

    // Google Sign In
    googleSignInBtn.addEventListener('click', async () => {
      googleSignInBtn.disabled = true;
      googleSignInBtn.textContent = 'جاري تسجيل الدخول...';
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error('Sign in error:', error);
        alert('فشل تسجيل الدخول: ' + error.message);
        googleSignInBtn.disabled = false;
        googleSignInBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> تسجيل الدخول بـ Google';
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });

    // Auth State Listener
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // User signed in
        authSection.style.display = 'none';
        hostContent.style.display = 'block';
        userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=4285f4&color=fff`;
        userName.textContent = user.displayName || 'مستخدم';
        userEmail.textContent = user.email;
        
        // Fetch user data from backend
        await fetchUserData(user);
      } else {
        // User signed out
        authSection.style.display = 'block';
        hostContent.style.display = 'none';
      }
    });

    async function fetchUserData(user) {
      try {
        const token = await getIdToken(user);
        const res = await fetch('/api/user', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          // Update UI with backend data if needed
          console.log('User data:', data);
        }
        // Simulate connections data for demo
        updateConnectionsDemo();
      } catch (error) {
        console.error('Fetch user data error:', error);
      }
    }

    function updateConnectionsDemo() {
      // Demo data - replace with real WebSocket connections
      const demoConnections = [
        { id: 1, name: 'أحمد محمد', lang: 'ar-MA', status: 'connected', messages: 12, time: '10:30' },
        { id: 2, name: 'John Smith', lang: 'en', status: 'waiting', messages: 0, time: '10:32' },
        { id: 3, name: 'Marie Dubois', lang: 'fr', status: 'connected', messages: 8, time: '10:28' },
      ];
      
      totalConnections.textContent = demoConnections.length;
      activeConnections.textContent = demoConnections.filter(c => c.status === 'connected').length;
      totalMessages.textContent = demoConnections.reduce((sum, c) => sum + c.messages, 0);
      
      connectionsList.innerHTML = demoConnections.map(conn => `
        <div class="connection-item">
          <div class="connection-info">
            <div class="connection-avatar">${conn.name.charAt(0)}</div>
            <div class="connection-details">
              <div class="connection-name">${conn.name}</div>
              <div class="connection-meta">اللغة: ${getLangName(conn.lang)} • آخر نشاط: ${conn.time}</div>
            </div>
          </div>
          <span class="connection-status status-${conn.status}">${getStatusText(conn.status)}</span>
        </div>
      `).join('');
    }

    function getLangName(code) {
      const names = { 'ar': 'العربية', 'ar-MA': 'الدارجة', 'en': 'English', 'fr': 'Français', 'es': 'Español', 'de': 'Deutsch' };
      return names[code] || code;
    }

    function getStatusText(status) {
      const texts = { 'connected': 'متصل', 'waiting': 'في الانتظار', 'disconnected': 'منقطع' };
      return texts[status] || status;
    }
  </script>

  <!-- Translator Logic (from original) -->
  <script>
    const sourceLang = document.getElementById('sourceLang');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const apiKeyInput = document.getElementById('apiKey');
    const statusEl = document.getElementById('status');

    let recognition = null;
    let isListening = false;
    let currentTranscript = '';
    let silenceTimer = null;
    const SILENCE_TIMEOUT = 2000;
    const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';
    const TRANSLATION_MODEL = 'google/gemma-2-9b-it:free';

    const langMap = {
      ar: 'ar-SA', darija: 'ar-MA', en: 'en-US', fr: 'fr-FR', es: 'es-ES',
      de: 'de-DE', it: 'it-IT', pt: 'pt-PT', ru: 'ru-RU',
      zh: 'zh-CN', ja: 'ja-JP', ko: 'ko-KR', tr: 'tr-TR'
    };

    const langNames = {
      ar: 'العربية', darija: 'المغربية (الدارجة)', en: 'English', fr: 'Français', es: 'Español',
      de: 'Deutsch', it: 'Italiano', pt: 'Português', ru: 'Русский',
      zh: '中文', ja: '日本語', ko: '한국어', tr: 'Türkçe'
    };

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setStatus('المتصفح لا يدعم التعرف على الكلام', 'error');
        startBtn.disabled = true;
        return false;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = langMap[sourceLang.value] || 'ar-SA';

      recognition.onstart = () => {
        isListening = true;
        setStatus('جاري الاستماع...', 'active');
        startBtn.disabled = true;
        stopBtn.disabled = false;
        sourceText.placeholder = 'تحدث الآن...';
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            final += transcript + ' ';
          } else {
            interim += transcript;
          }
        }
        currentTranscript = final.trim();
        sourceText.value = currentTranscript + (interim ? ' ' + interim : '');
        if (final) {
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (currentTranscript) translateText(currentTranscript);
          }, SILENCE_TIMEOUT);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech') return;
        setStatus('خطأ: ' + e.error, 'error');
        console.error('Speech recognition error:', e.error);
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) { stopListening(); }
        }
      };

      return true;
    }

    function startListening() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        setStatus('يرجى إدخال مفتاح OpenRouter API', 'error');
        apiKeyInput.focus();
        return;
      }
      if (!initSpeechRecognition()) return;
      currentTranscript = '';
      sourceText.value = '';
      targetText.value = '';
      recognition.start();
    }

    function stopListening() {
      isListening = false;
      clearTimeout(silenceTimer);
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('تم الإيقاف', '');
      sourceText.placeholder = 'سيظهر النص المسموع هنا...';
    }

    async function translateText(text) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) return;

      const isDarija = sourceLang.value === 'darija';
      const targetLang = isDarija ? 'ar' : (sourceLang.value === 'ar' ? 'en' : 'ar');
      const targetLangName = langNames[targetLang] || 'English';

      setStatus('جاري الترجمة...', 'active');
      targetText.value = '...';

      const sourceLangName = langNames[sourceLang.value] || 'the source language';
      const prompt = `Translate the following text from ${sourceLangName} to ${targetLangName}. Return ONLY the translation, no explanations:\n\n"${text}"`;

      try {
        const res = await fetch(OPENROUTER_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Instant Translator'
          },
          body: JSON.stringify({
            model: TRANSLATION_MODEL,
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.3,
            max_tokens: 500
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const translation = data.choices?.[0]?.message?.content?.trim() || '';
        targetText.value = translation;
        setStatus('تمت الترجمة', 'active');
        speakText(translation, targetLang);
      } catch (e) {
        console.error('Translation error:', e);
        targetText.value = 'خطأ في الترجمة';
        setStatus('فشل الترجمة: ' + e.message, 'error');
      }
    }

    function speakText(text, lang) {
      if (!('speechSynthesis' in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langMap[lang] || 'en-US';
      utterance.rate = 1;
      utterance.pitch = 1;
      speechSynthesis.speak(utterance);
    }

    startBtn.addEventListener('click', startListening);
    stopBtn.addEventListener('click', stopListening);
    sourceLang.addEventListener('change', () => {
      if (recognition && isListening) {
        recognition.lang = langMap[sourceLang.value] || 'ar-SA';
      }
    });

    apiKeyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startListening();
    });
  </script>
</body>
</html>
