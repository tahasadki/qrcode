<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المضيف - رياض دار النخيل</title>
  <!-- Owner Firestore rules will be tightened later -->
  <link rel="stylesheet" href="index.css">
  <style>
    .owner-page {
      min-height: 100vh;
      background: var(--sand);
      font-family: "Cairo", sans-serif;
    }

    .owner-header {
      background: var(--brown);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .owner-header h1 {
      font-family: "Amiri", Georgia, serif;
      font-size: 22px;
      margin: 0;
    }

    .auth-section, .dashboard-section {
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .login-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(62, 43, 32, 0.1);
    }

    .login-card h2 {
      font-family: "Amiri", Georgia, serif;
      font-size: 24px;
      margin-bottom: 24px;
      color: var(--brown);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--brown);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--terracotta);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: "Cairo", sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:hover {
      background: var(--terracotta-dark);
    }

    .login-error {
      color: var(--red);
      margin-top: 12px;
      font-weight: 600;
      display: none;
    }

    .rooms-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .rooms-header h2 {
      margin: 0;
      font-family: "Amiri", Georgia, serif;
      font-size: 22px;
      color: var(--brown);
    }

    .room-item {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(62, 43, 32, 0.08);
    }

    .room-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .room-id {
      font-family: monospace;
      font-weight: 700;
      color: var(--terracotta);
      direction: ltr;
    }

    .room-time {
      font-size: 12px;
      color: #666;
    }

    .accept-btn {
      background: var(--green);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: "Cairo", sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .accept-btn:hover {
      background: #2e7d32;
    }

    .no-calls {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 16px;
    }

    .owner-new-call-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--green);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 9999;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .video-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(62, 43, 32, 0.1);
      margin-bottom: 20px;
    }

    .video-header {
      background: var(--brown);
      color: white;
      padding: 16px 20px;
      font-weight: 600;
      font-size: 15px;
    }

    .video-area {
      position: relative;
      aspect-ratio: 16/9;
      background: #111;
      overflow: hidden;
    }

    .video-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-area video[local] {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 180px;
      height: 101px;
      border-radius: 8px;
      border: 3px solid var(--gold);
      background: #000;
      z-index: 10;
    }

    .video-area .waiting {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
      gap: 12px;
    }

    .video-area .waiting .icon {
      font-size: 48px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .controls-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(62, 43, 32, 0.1);
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .status-row.waiting {
      background: rgba(189, 145, 75, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold-light);
    }

    .status-row.connecting {
      background: rgba(147, 73, 54, 0.15);
      color: var(--terracotta);
      border: 1px solid var(--terracotta);
    }

    .status-row.connected {
      background: rgba(61, 122, 82, 0.15);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .status-row.failed {
      background: rgba(150, 63, 53, 0.15);
      color: var(--red);
      border: 1px solid var(--red);
    }

    .control-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-family: "Cairo", sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .ctrl-btn:hover {
      transform: translateY(-2px);
    }

    .btn-mute {
      background: var(--brown-light);
      color: white;
    }

    .btn-camera {
      background: var(--terracotta);
      color: white;
    }

    .btn-end {
      background: var(--terracotta-dark);
      color: white;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--terracotta);
      font-weight: 600;
      text-decoration: none;
      margin-top: 16px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .error-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--terracotta-dark);
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 9999;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 600px) {
      .video-area video[local] {
        width: 120px;
        height: 67px;
        bottom: 8px;
        right: 8px;
      }

      .ctrl-btn {
        padding: 10px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body class="owner-page">
  <header class="owner-header">
    <h1>لوحة المضيف</h1>
    <div id="ownerUserDisplay"></div>
  </header>

  <!-- Auth Section -->
  <section id="authSection" class="auth-section">
    <div class="login-card">
      <h2>تسجيل الدخول للمضيف</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">كلمة المرور</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" id="loginBtn" class="login-btn">تسجيل الدخول</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </section>

  <!-- Dashboard Section -->
  <section id="dashboardSection" class="dashboard-section" style="display:none;">
    <div class="rooms-header">
      <h2>المكالمات في الانتظار</h2>
    </div>
    <div id="noCallsMsg" class="no-calls">ما كاين حتى مكالمة دابا</div>
    <div id="roomsList"></div>
    <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>
  </section>

  <!-- Video Call Section -->
  <section id="ownerVideoPanel" style="display:none;">
    <div class="video-panel">
      <div class="video-header">فيديو الزائر</div>
      <div class="video-area" id="ownerRemoteArea">
        <div class="waiting" id="ownerRemoteWaiting">
          <div class="icon">📞</div>
          <span>في انتظار الفيديو…</span>
        </div>
        <video id="ownerRemoteVideo" autoplay playsinline style="display:none;"></video>
      </div>
    </div>
    <div class="video-panel">
      <div class="video-header">فيديو المضيف</div>
      <div class="video-area" id="ownerLocalArea">
        <div class="waiting" id="ownerLocalWaiting">
          <div class="icon">🎥</div>
          <span>جاري تشغيل الكاميرا…</span>
        </div>
        <video id="ownerLocalVideo" autoplay muted playsinline local style="display:none;"></video>
      </div>
    </div>

    <div class="controls-panel">
      <div class="status-row waiting" id="ownerStatusRow">
        <span id="ownerStatusText">جاري الرد على المكالمة…</span>
      </div>
      <div class="control-row">
        <button class="ctrl-btn btn-mute" id="ownerMuteBtn">🎤 كتم</button>
        <button class="ctrl-btn btn-camera" id="ownerCameraBtn">📷 إيقاف الكاميرا</button>
        <button class="ctrl-btn btn-end" id="ownerEndBtn">📵 إنهاء المكالمة</button>
      </div>
    </div>
    <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>
  </section>

  <!-- Firebase Config -->
  <script type="module" src="firebase-config.js"></script>
  <!-- Owner Config -->
  <script type="module" src="owner-config.js"></script>
  <!-- Firebase SDK + Owner Logic -->
  <script type="module" src="owner.js"></script>
</body>
</html>
